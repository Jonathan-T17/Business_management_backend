# Combine with docker-compose.production.yml; scanner has no host port or media mount.
services:
  clamav:
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to a reviewed supported official ClamAV image}
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks: [upload_scanning, scanner_updates]
  backend:
    environment:
      ATTACHMENT_SCANNER: documents.scanning.clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    networks: [default, upload_scanning]
    depends_on:
      clamav: {condition: service_healthy}
networks:
  upload_scanning:
    internal: true
  scanner_updates: {}
volumes:
  clamav_signatures:
